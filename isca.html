<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guardião X</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<style>
body{margin:0;background:#070a14;color:#fff;font-family:Arial;display:flex;justify-content:center;align-items:center;min-height:100vh}
.card{background:#111827;border:2px solid #1d4ed8;border-radius:20px;padding:24px;width:90%;max-width:360px;text-align:center}
button{width:100%;padding:16px;border-radius:12px;border:0;font-weight:bold;font-size:18px;margin-top:12px}
#btnA{background:#2563eb;color:#fff}
#btnOn{background:#16a34a;color:#fff;display:none}
#btnOff{background:#dc2626;color:#fff;display:none}
.box{text-align:left;background:#1f2937;padding:12px;border-radius:10px;margin-top:14px;font-size:14px}
</style>
</head>
<body>
<div class="card">
<h2>🛡️ Guardião X</h2>
<p id="txt">Solicitação de localização para:<br><b id="v">MOTO</b></p>
<div class="box"><label><input type="checkbox" id="chk"> Eu <b>autorizo</b> o compartilhamento da minha localização para segurança e rastreamento.</label></div>
<button id="btnA" onclick="autoriza()">EU AUTORIZO</button>
<button id="btnOn" onclick="liga()">ATIVAR RASTREAMENTO</button>
<button id="btnOff" onclick="desliga()">DESATIVAR RASTREAMENTO</button>
<p id="st" style="margin-top:14px;color:#9ca3af">Aguardando autorização...</p>
</div>
<script>
const cfg={apiKey:"AIzaSyBi-kFZpp8C1PicxzimfImnwkClD_DbnwY",authDomain:"guardiao-d.firebaseapp.com",databaseURL:"https://guardiao-d-default-rtdb.firebaseio.com",projectId:"guardiao-d",storageBucket:"guardiao-d.firebasestorage.app",messagingSenderId:"185879532988",appId:"1:185879532988:web:6ceec9346b1934eb88c7b9"};
firebase.initializeApp(cfg);
const db=firebase.database();
const qs=new URLSearchParams(location.search);
const canal=qs.get('c')||'guardiao-YW5vbg-42359';
const veic=qs.get('v')||'MOTO';
document.getElementById('v').innerText=veic;
let wid=null;
function autoriza(){
 if(!document.getElementById('chk').checked){alert('Marque a autorização');return}
 document.getElementById('st').innerText='✅ Autorizado!';
 document.getElementById('btnA').style.display='none';
 document.getElementById('btnOn').style.display='block';
}
function liga(){
 document.getElementById('st').innerText='📡 Ativando...';
 wid=navigator.geolocation.watchPosition(p=>{
   db.ref('dispositivos/'+canal+'/'+veic).set({id:veic,lat:p.coords.latitude,lng:p.coords.longitude,autorizado:true,data:new Date().toLocaleString('pt-BR'),acc:p.coords.accuracy});
   document.getElementById('st').innerHTML='✅ <b>RASTREAMENTO ATIVO</b><br>'+veic+'<br>Prec: '+Math.round(p.coords.accuracy)+'m';
   document.getElementById('btnOn').style.display='none';
   document.getElementById('btnOff').style.display='block';
 },e=>{document.getElementById('st').innerText='❌ Ative o GPS e clique em Permitir';},{enableHighAccuracy:true});
}
function desliga(){
 if(wid!==null) navigator.geolocation.clearWatch(wid);
 db.ref('dispositivos/'+canal+'/'+veic).remove();
 document.getElementById('st').innerText='🛑 Rastreamento desativado';
 document.getElementById('btnOff').style.display='none';
 document.getElementById('btnA').style.display='block';
 document.getElementById('chk').checked=false;
}
</script>
</body>
</html>
