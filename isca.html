<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ISCA - GUARDIÃO X</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<style>body{background:#070a14;color:#fff;font-family:sans-serif;text-align:center;padding:40px}.box{background:#111827;border:1px solid #374151;border-radius:12px;padding:20px;max-width:360px;margin:auto}</style>
</head>
<body>
<div class="box"><h2>🎯 ISCA ATIVA</h2><p id="status">Iniciando GPS...</p><p id="bat">🔋 Bateria: --</p><p style="font-size:11px;color:#d1d5db">Deixe essa aba aberta. Não feche.</p></div>
<script>
const firebaseConfig={apiKey:"AIzaSyBi-kFZpp8C1PicxzimfImnwkClD_DbnwY",authDomain:"guardiao-d.firebaseapp.com",databaseURL:"https://guardiao-d-default-rtdb.firebaseio.com",projectId:"guardiao-d",storageBucket:"guardiao-d.firebasestorage.app",messagingSenderId:"185879532988",appId:"1:185879532988:web:6ceec9346b1934eb88c7b9"};
firebase.initializeApp(firebaseConfig);
const db=firebase.database();
const params=new URLSearchParams(location.search);
const canal=params.get('c')||'guardiao_anon';
const nome=params.get('v')||'ISCA';
let bateriaAtual=null;
async function atualizarBateria(){try{if(navigator.getBattery){let b=await navigator.getBattery();bateriaAtual=Math.round(b.level*100);document.getElementById('bat').textContent='🔋 Bateria: '+bateriaAtual+'%'+(b.charging?' ⚡ Carregando':'');}}catch(e){}}
atualizarBateria();setInterval(atualizarBateria,30000);
function enviar(lat,lng){db.ref('dispositivos/'+canal+'/'+nome).set({nome:nome,id:nome,lat:lat,lng:lng,bat:bateriaAtual,ativo:true,time:new Date().toLocaleTimeString('pt-BR')});document.getElementById('status').textContent='📍 Enviando: '+lat.toFixed(5)+', '+lng.toFixed(5);}
if(navigator.geolocation){navigator.geolocation.watchPosition(p=>{enviar(p.coords.latitude,p.coords.longitude);},e=>{document.getElementById('status').textContent='❌ Erro GPS: '+e.message;},{enableHighAccuracy:true,maximumAge:0,timeout:10000});}else{document.getElementById('status').textContent='GPS não suportado';}
</script>
</body>
</html>
