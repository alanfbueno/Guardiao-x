<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guardião X</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<style>
body{margin:0;background:#070a14;color:#fff;font-family:Arial;display:flex;justify-content:center;align-items:center;min-height:100vh}
.card{background:#111827;border:2px solid #2563eb;border-radius:20px;padding:24px;width:90%;max-width:360px;text-align:center}
button{width:100%;padding:16px;border-radius:12px;border:0;font-weight:bold;font-size:18px;margin-top:12px;cursor:pointer}
#btnA{background:#2563eb;color:#fff}
#btnOn{background:#16a34a;color:#fff;display:none}
#btnOff{background:#dc2626;color:#fff;display:none}
</style>
</head>
<body>
<div class="card">
<h2>🛡️ Guardião X</h2>
<p id="vLabel">MOTO</p>
<button id="btnA">EU AUTORIZO</button>
<button id="btnOn">ATIVAR RASTREAMENTO</button>
<button id="btnOff">DESATIVAR RASTREAMENTO</button>
<p id="st">Aguardando...</p>
</div>
<script>
const cfg={apiKey:"AIzaSyBi-kFZpp8C1PicxzimfImnwkClD_DbnwY",authDomain:"guardiao-d.firebaseapp.com",databaseURL:"https://guardiao-d-default-rtdb.firebaseio.com",projectId:"guardiao-d",storageBucket:"guardiao-d.firebasestorage.app",messagingSenderId:"185879532988",appId:"1:185879532988:web:6ceec9346b1934eb88c7b9"};
firebase.initializeApp(cfg);
const db=firebase.database();
const p=new URLSearchParams(location.search);
const c=p.get('c')||'guardiao-YW5vbg-42359';
const v=p.get('v')||'MOTO';
document.getElementById('vLabel').innerText=v;
let wid=null;
function R(){return db.ref('dispositivos/'+c+'/'+v);}
function apaga(){
  try{
    R().remove();
    R().set(null);
    fetch('https://guardiao-d-default-rtdb.firebaseio.com/dispositivos/'+c+'/'+v+'.json',{method:'DELETE',keepalive:true});
  }catch(e){}
}
window.addEventListener('beforeunload',apaga);
window.addEventListener('pagehide',apaga);
document.getElementById('btnA').onclick=function(){
  document.getElementById('st').innerText='✅ Autorizado';
  document.getElementById('btnA').style.display='none';
  document.getElementById('btnOn').style.display='block';
};
document.getElementById('btnOn').onclick=function(){
  document.getElementById('st').innerText='📡 Ativando...';
  R().onDisconnect().remove();
  wid=navigator.geolocation.watchPosition(function(pos){
    R().set({id:v,lat:pos.coords.latitude,lng:pos.coords.longitude,autorizado:true,data:new Date().toLocaleString('pt-BR')});
    document.getElementById('st').innerHTML='✅ ATIVO<br>'+v;
    document.getElementById('btnOn').style.display='none';
    document.getElementById('btnOff').style.display='block';
  },function(){document.getElementById('st').innerText='❌ Ative o GPS';},{enableHighAccuracy:true});
};
document.getElementById('btnOff').onclick=function(){
  if(wid!==null) navigator.geolocation.clearWatch(wid);
  apaga();
  setTimeout(apaga,600);
  document.getElementById('st').innerText='🛑 Sumiu do mapa';
  document.getElementById('btnOff').style.display='none';
  document.getElementById('btnA').style.display='block';
};
</script>
</body>
</html>
