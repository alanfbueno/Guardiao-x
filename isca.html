<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guardião X</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<style>
body{margin:0;background:#070a14;color:#fff;font-family:Arial;display:flex;justify-content:center;align-items:center;min-height:100vh}
.card{background:#111827;border:2px solid #2563eb;border-radius:20px;padding:24px;width:90%;max-width:360px;text-align:center;box-shadow:0 0 20px rgba(37,99,235,0.3)}
button{width:100%;padding:16px;border-radius:12px;border:0;font-weight:bold;font-size:18px;margin-top:12px;cursor:pointer}
#btnA{background:#2563eb;color:#fff}
#btnOn{background:#16a34a;color:#fff;display:none}
#btnOff{background:#dc2626;color:#fff;display:none}
#st{margin-top:14px;color:#9ca3af;font-size:14px}
</style>
</head>
<body>
<div class="card">
<h2>🛡️ Guardião X</h2>
<p>Local para:<br><b id="vLabel">MOTO</b></p>
<p style="font-size:12px;color:#9ca3af">Autorize o compartilhamento para segurança.</p>
<button id="btnA">EU AUTORIZO</button>
<button id="btnOn">ATIVAR RASTREAMENTO</button>
<button id="btnOff">DESATIVAR RASTREAMENTO</button>
<p id="st">Aguardando...</p>
</div>

<script>
const cfg={apiKey:"AIzaSyBi-kFZpp8C1PicxzimfImnwkClD_DbnwY",authDomain:"guardiao-d.firebaseapp.com",databaseURL:"https://guardiao-d-default-rtdb.firebaseio.com",projectId:"guardiao-d",storageBucket:"guardiao-d.firebasestorage.app",messagingSenderId:"185879532988",appId:"1:185879532988:web:6ceec9346b1934eb88c7b9"};
firebase.initializeApp(cfg);
const db=firebase.database();

const qs=new URLSearchParams(location.search);
const canal=qs.get('c')||'guardiao-YW5vbg-42359';
const veic=qs.get('v')||'MOTO';
document.getElementById('vLabel').innerText=veic;

let wid=null;
const getRef=()=>db.ref('dispositivos/'+canal+'/'+veic);

// FUNÇÃO QUE APAGA MESMO
function apaga(){
  try{
    const ref = getRef();
    ref.remove();
    ref.onDisconnect().cancel();
    ref.onDisconnect().remove();
    // garante apaga mesmo fechando a aba
    fetch("https://guardiao-d-default-rtdb.firebaseio.com/dispositivos/"+canal+"/"+veic+".json", {method:"DELETE", keepalive:true});
    console.log("APAGADO DO MAPA");
  }catch(e){}
}

window.addEventListener('beforeunload', apaga);
window.addEventListener('pagehide', apaga);
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='hidden') apaga(); });

document.getElementById('btnA').onclick=()=>{
 document.getElementById('st').innerText='✅ Autorizado!';
 document.getElementById('btnA').style.display='none';
 document.getElementById('btnOn').style.display='block';
};

document.getElementById('btnOn').onclick=()=>{
 document.getElementById('st').innerText='📡 Ativando GPS...';
 const ref=getRef();
 ref.onDisconnect().remove();
 wid=navigator.geolocation.watchPosition(p=>{
  ref.set({id:veic,lat:p.coords.latitude,lng:p.coords.longitude,autorizado:true,data:new Date().toLocaleString('pt-BR'),acc:p.coords.accuracy});
  document.getElementById('st').innerHTML='✅ <b>RASTREAMENTO ATIVO</b><br>'+veic+'<br>Prec: '+Math.round(p.coords.accuracy)+'m';
  document.getElementById('btnOn').style.display='none';
  document.getElementById('btnOff').style.display='block';
 },()=>{
  document.getElementById('st').innerHTML='❌ <b>Ative o GPS</b><br>Clique em Permitir';
 },{enableHighAccuracy:true, timeout:10000, maximumAge:0});
};

document.getElementById('btnOff').onclick=()=>{
 if(wid!==null) navigator.geolocation.clearWatch(wid);
 apaga();
 document.getElementById('st').innerText='🛑 Desativado - sumiu do mapa';
 // reforça o delete
 setTimeout(apaga, 300);
 setTimeout(apaga, 1000);
 document.getElementById('btnOff').style.display='none';
 document.getElementById('btnA').style.display='block';
};
</script>
</body>
</html>
