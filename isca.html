<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GUARDIÃO X - ISCA FIREBASE</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<style>
:root{--bg:#070a14;--green:#00ff88;--text:#fff;--muted:#d1d5db;--red:#ef4444;--card:#111827;--border:#374151}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
body{background:var(--bg);color:var(--text);display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;text-align:center}
.box{background:var(--card);border:2px solid var(--green);border-radius:16px;padding:24px;width:100%;max-width:360px;box-shadow:0 0 25px rgba(0,255,136,0.2)}
h2{color:var(--green);font-size:15px;margin-bottom:8px;font-weight:900}
p{font-size:12px;line-height:1.5;margin-bottom:10px}
.status{font-size:11px;color:var(--muted);margin-bottom:10px}
.coord{font-family:monospace;font-size:11px;color:#facc15;background:#1f2937;padding:10px;border-radius:8px;border:1px solid var(--border);word-break:break-all}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block;margin-bottom:8px}
.dot.off{background:#374151}.dot.on{background:var(--green);box-shadow:0 0 10px var(--green);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.btn{width:100%;padding:12px;border:none;border-radius:8px;font-weight:900;font-size:12px;cursor:pointer;margin-top:8px}
.btn.on{background:var(--green);color:#000}.btn.off{background:var(--red);color:#fff}.btn.gray{background:#374151;color:#fff}
</style>
</head>
<body>

<div class="box" id="telaConsentimento">
  <h2>🛡️ SOLICITAÇÃO DE LOCALIZAÇÃO</h2>
  <p>O operador solicitou rastreamento:</p>
  <p><b id="txtVeiculo" style="color:var(--green);font-size:14px"></b></p>
  <button class="btn on" onclick="darConsentimento()">✅ EU AUTORIZO</button>
  <button class="btn gray" onclick="negar()">❌ NÃO AUTORIZO</button>
</div>

<div class="box" id="telaRastreio" style="display:none">
  <div><span id="dot" class="dot off"></span></div>
  <h2>🎯 RASTREAMENTO ATIVO</h2>
  <div class="status" id="txtStatus">Pronto.</div>
  <div class="coord" id="txtCoord">Aguardando...</div>
  <button id="btnToggle" class="btn on" onclick="toggle()">🔴 ATIVAR RASTREAMENTO</button>
</div>

<div class="box" id="telaNegado" style="display:none">
  <h2>❌ NÃO AUTORIZADO</h2>
  <p>Pode fechar a página.</p>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBi-kFZpp8C1PicxzimfImnwkClD_DbnwY",
  authDomain: "guardiao-d.firebaseapp.com",
  databaseURL: "https://guardiao-d-default-rtdb.firebaseio.com",
  projectId: "guardiao-d",
  storageBucket: "guardiao-d.firebasestorage.app",
  messagingSenderId: "185879532988",
  appId: "1:185879532988:web:6ceec9346b1934eb88c7b9"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const params = new URLSearchParams(location.search);
const canal = params.get('c') || 'guardiao_anon';
const veiculoId = params.get('v') || 'MOTO';
const safe = veiculoId.replace(/[^a-zA-Z0-9]/g, '_');

document.getElementById('txtVeiculo').textContent = veiculoId;

const txtStatus=document.getElementById('txtStatus'), txtCoord=document.getElementById('txtCoord'), dot=document.getElementById('dot'), btn=document.getElementById('btnToggle');
let watchId=null, ativo=false;

function getRef(){ return db.ref(`dispositivos/${canal}/${safe}`); }

function apagaFirebase(){
  try{
    const r = getRef();
    r.remove();
    r.set(null);
    r.onDisconnect().cancel();
    fetch(`https://guardiao-d-default-rtdb.firebaseio.com/dispositivos/${canal}/${safe}.json`,{method:'DELETE',keepalive:true});
  }catch(e){}
}

window.addEventListener('beforeunload', apagaFirebase);
window.addEventListener('pagehide', apagaFirebase);

function darConsentimento(){
  document.getElementById('telaConsentimento').style.display='none';
  document.getElementById('telaRastreio').style.display='block';
}
function negar(){
  document.getElementById('telaConsentimento').style.display='none';
  document.getElementById('telaNegado').style.display='block';
}
function toggle(){ if(!ativo) ativar(); else desativar(); }

function ativar(){
  ativo=true;
  dot.className='dot on';
  btn.className='btn off';
  btn.textContent='🟢 DESATIVAR E SUMIR DO MAPA';
  txtStatus.innerHTML='📡 Buscando GPS...';
  getRef().onDisconnect().remove();
  watchId=navigator.geolocation.watchPosition(enviar, erro, {enableHighAccuracy:true,maximumAge:0,timeout:15000});
}

function desativar(){
  ativo=false;
  if(watchId!==null) navigator.geolocation.clearWatch(watchId);
  watchId=null;
  apagaFirebase();
  setTimeout(apagaFirebase, 400);
  setTimeout(apagaFirebase, 1000);
  dot.className='dot off';
  btn.className='btn on';
  btn.textContent='🔴 ATIVAR RASTREAMENTO';
  txtStatus.innerHTML='🛑 Desativado - você sumiu do mapa';
  txtCoord.innerHTML='Removido do Firebase.';
}

function enviar(pos){
  getRef().set({
    id: veiculoId,
    lat: pos.coords.latitude,
    lng: pos.coords.longitude,
    acc: pos.coords.accuracy,
    time: new Date().toLocaleTimeString('pt-BR')
  }).then(()=>{
    txtStatus.innerHTML=`🟢 ENVIANDO - ${veiculoId}`;
    txtCoord.innerHTML=`LAT: ${pos.coords.latitude.toFixed(6)}<br>LNG: ${pos.coords.longitude.toFixed(6)}<br>${pos.coords.accuracy.toFixed(0)}m`;
  });
}
function erro(e){ txtStatus.innerHTML=`❌ Erro: ${e.message}`; }
</script>
</body>
</html>
