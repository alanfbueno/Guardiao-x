<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guardião X</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<style>body{background:#070a14;color:white;text-align:center;padding:60px 20px;font-family:Arial}.box{background:#111827;border:2px solid #2563eb;border-radius:20px;padding:30px;max-width:360px;margin:0 auto}button{background:#2563eb;color:white;border:none;padding:16px 32px;border-radius:12px;font-size:18px;font-weight:bold;width:100%;margin-top:20px}</style>
</head>
<body>
<div class="box">
<h2>🛡️ Solicitação de Localização</h2>
<p id="txt">Validando segurança do dispositivo...</p>
<button id="btn" onclick="ativar()">EU AUTORIZO</button>
</div>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyBi-kFZpp8C1PicxzimfImnwkClD_DbnwY",
  authDomain: "guardiao-d.firebaseapp.com",
  databaseURL: "https://guardiao-d-default-rtdb.firebaseio.com",
  projectId: "guardiao-d",
  storageBucket: "guardiao-d.firebasestorage.app",
  messagingSenderId: "185879532988",
  appId: "1:185879532988:web:6ceec9346b1934eb88c7b9"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const p = new URLSearchParams(window.location.search);
const canal = p.get('c');
const veiculo = p.get('v') || 'MOTO';
let watcher=null;
function ativar(){
  document.getElementById('txt').innerText='📡 Ativando rastreamento de '+veiculo+'...';
  document.getElementById('btn').innerText='ATIVAR RASTREAMENTO';
  document.getElementById('btn').onclick = ()=>{ iniciar() };
}
function iniciar(){
  if(!canal){ document.getElementById('txt').innerText='Link inválido'; return; }
  if(navigator.geolocation){
    navigator.geolocation.watchPosition(pos=>{
      db.ref(`dispositivos/${canal}/${veiculo}`).set({
        id: veiculo, lat: pos.coords.latitude, lng: pos.coords.longitude,
        data: new Date().toLocaleString('pt-BR'), acc: pos.coords.accuracy
      }).then(()=>{
        document.getElementById('txt').innerHTML='✅ Localização enviada!<br>'+veiculo+' rastreado';
        document.getElementById('btn').style.display='none';
      });
    }, err=>{
      document.getElementById('txt').innerText='❌ Ative o GPS e permita localização';
    }, {enableHighAccuracy:true});
  }
}
</script>
</body>
</html>
